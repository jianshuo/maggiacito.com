name: deploy
# Build the Hugo site and deploy to GitHub Pages on every push to main.
# This is the "auto-deploy" half of the feedback loop: feedback.yml pushes a
# commit to main, and this workflow ships it to https://maggiacito.com/.
# Pages source must be set to "GitHub Actions" (repo Settings → Pages).
on:
  push:
    branches: [main]
  workflow_dispatch:
  # The feedback loop pushes to main with GITHUB_TOKEN, which (by GitHub's
  # recursion-prevention rule) does NOT trigger the push event above. So also
  # deploy whenever the feedback-loop workflow finishes — that ships its commit.
  workflow_run:
    workflows: ["feedback-loop"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.162.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Hugo CLI (extended)
        run: |
          wget -O hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i hugo.deb

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build
        run: hugo --minify

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
